  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, initializeFirestore, persistentLocalCache, collection, addDoc, onSnapshot, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs, query, where, Timestamp, deleteField, writeBatch } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { Utensils, Settings, Plus, Trash2, CheckCircle2, ChevronLeft, Store, Loader2, X, Phone, Download, Users, Minus, Save, Lock, Check, UserCheck, UserPlus, ClipboardCheck, Camera, CalendarDays, Edit2, Wifi, WifiOff, AlertCircle, FileText, PhoneCall, Tag, ZoomIn, Copy, Clock, RotateCcw } from 'lucide-react';

    // ============================================================================
    // 【Firebase 設定】設定值、appId、Firebase 實例初始化
    // ============================================================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // 這只是 Firestore 路徑的一段字串，填什麼都能跑；改了要同步改 firestore.rules 的 match 路徑
    const appId = 'lunch-orders';

    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ============================================================================
    // 【帳號模型】四組帳號、EMAIL_DOMAIN、驗證用命名 app 實例
    // ============================================================================
    // 登入走 Firebase Email/Password 帳號驗證，前端不存放任何密碼素材
    //   工坊 PIN   → <workshopId>@lunch.local（登入 default app）
    //   管理員密碼 → admin@lunch.local（獨立 instance 驗過即登出，僅作前端閘門）
    //   系統管理員 → sysadmin@lunch.local（獨立 instance，面板開啟期間維持登入以寫 units）
    // 這不是真的信箱，只是 Firebase 要一個 email 形狀的帳號名；.local 是保留給區網的假網域
    const EMAIL_DOMAIN = '@lunch.local';
    const SESSION_DURATION = 8 * 60 * 60 * 1000; // 工坊登入 session 8 小時

    // 獨立命名 app：驗證時不動 default app 的 auth 狀態（同名重入時取回既有 app）
    const namedApp = (name) => {
      try { return initializeApp(firebaseConfig, name); }
      catch (e) { return getApp(name); }
    };
    const adminVerifyAuth = getAuth(namedApp('admin-verify'));
    const sysAdminApp = namedApp('sysadmin-verify');
    const sysAdminAuth = getAuth(sysAdminApp);
    const sysAdminDb = getFirestore(sysAdminApp);

    let db;
    try {
        // v14.6.0：持久本地快取（IndexedDB，iPad 單分頁用 single-tab 預設）+ 長輪詢自動偵測（受限網路 SDK 自動 fallback）
        db = initializeFirestore(app, {
          localCache: persistentLocalCache({}),
          experimentalAutoDetectLongPolling: true,
        });
    } catch (e) { db = getFirestore(app); } // IndexedDB 不可用的舊裝置 fallback

    // ============================================================================
    // 【工坊備用資料】units 整份讀不到時的 fallback
    // ============================================================================
    // 備用資料（僅在 units 整份讀不到或為空時整批啟用；密碼由 Firebase Auth 驗證，此處不含密碼素材）
    const WORKSHOPS_FALLBACK = [
      { id: 'sunny', label: '陽光工坊', label_en: 'SUNNY WORKSHOP', color: '#f97316', address: '範例路 1 號' },
      { id: 'river', label: '河岸工坊', label_en: 'RIVER WORKSHOP', color: '#6366f1', address: '範例路 2 號' },
    ];

    // ============================================================================
    // 【版本記錄】CHANGELOG — 版本號從此自動讀取
    // ============================================================================
    // 版本更新紀錄
    const CHANGELOG = [
      { version: 'v1.0.0', date: '2026-09-08', changes: [
        '開源初版',
      ]},
    ];

    // ============================================================================
    // 【Firestore 路徑】units／共用菜單／各工坊資料
    // ============================================================================
    // Firestore 路徑：工坊認證設定
    const unitsColPath = () => `artifacts/${appId}/public/data/units`;

    // 共用集合路徑（colName_shared）— 目前僅資料遷移工具使用，日常菜單走 menuPath
    const sharedColPath = (col) => `artifacts/${appId}/public/data/${col}_shared`;
    // 工坊專屬路徑（人員、訂單、排程、設定）
    const workshopPath = (wid, seg) => `artifacts/${appId}/public/data/workshops/${wid}/${seg}`;

    // ============================================================================
    // 【業務常數與排序】分類、角色順序、小抄排序與合併
    // ============================================================================
    const CATEGORIES = ['飯類', '麵類', '湯品', '小菜', '飲料', '醬料', '其他'];
    const ROLE_ORDER = { client: 1, trial: 2, staff: 3, parttime: 4, intern: 5, volunteer: 6, visitor: 7 };
    const ROLE_LABELS = { client: '服務對象', trial: '試作', staff: '員工', parttime: '工讀生', intern: '實習生', volunteer: '志工', visitor: '訪客' };
    const ROLE_COLORS = { client: 'bg-emerald-100 text-emerald-700', trial: 'bg-cyan-100 text-cyan-700', staff: 'bg-indigo-100 text-indigo-700', parttime: 'bg-sky-100 text-sky-700', intern: 'bg-teal-100 text-teal-700', volunteer: 'bg-purple-100 text-purple-700', visitor: 'bg-amber-100 text-amber-700' };
    const roleSort = (a, b) => (ROLE_ORDER[a.role] || 99) - (ROLE_ORDER[b.role] || 99) || (a.createdAt || 0) - (b.createdAt || 0);
    const scriptItemSort = (a, b) => {
      const idxA = CATEGORIES.indexOf(a.category ?? '其他'); const idxB = CATEGORIES.indexOf(b.category ?? '其他');
      const catA = idxA === -1 ? 99 : idxA; const catB = idxB === -1 ? 99 : idxB;
      if (catA !== catB) return catA - catB;
      return a.name.localeCompare(b.name, 'zh-TW');
    };
    // 小抄品項合併：將同主品項（去掉「（xxx）」後相同）合併為一條，變體列於括號內
    const mergeScriptItems = (items) => {
      const map = {};
      items.forEach(item => {
        const m = item.name.match(/^(.*?)（([^）]*)）\s*$/);
        const baseName = m ? m[1].trim() : item.name;
        const variant = m ? m[2] : null;
        if (!map[baseName]) map[baseName] = { baseName, total: 0, unit: item.unit, variants: [] };
        map[baseName].total += item.count;
        if (variant) map[baseName].variants.push({ label: variant, count: item.count });
      });
      return Object.values(map).map(g => {
        const variantStr = g.variants.length > 0 ? `(其中${g.variants.map(v => `${v.label}${v.count}份`).join('、')})` : '';
        return `${g.baseName} ${g.total}${g.unit}${variantStr}`;
      }).join('、');
    };
    const DAY_NAMES = ['日','一','二','三','四','五','六'];
    const SOFT_DELETE_KEEP_MS = 5 * 24 * 60 * 60 * 1000;
    // ============================================================================
    // 【寫入錯誤對照】WRITE_ERROR_REASON
    // ============================================================================
    // 寫入失敗的可讀原因（Firestore error code → 使用者看得懂的一句話）
    const WRITE_ERROR_REASON = {
      'permission-denied': '沒有權限',
      'unavailable': '網路連線異常',
      'failed-precondition': '網路連線異常',
    };

    // ============================================================================
    // 【共用工具】日期字串、HTML 轉義
    // ============================================================================
    const getLocalDateStr = (d = new Date()) => `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;

    // v14.6.0：HTML 轉義 — 列印組版（document.write）內所有動態字串插值必經此函式，防特殊字元破版/注入
    const escapeHtml = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ============================================================================
    // 【App 主程式】
    // ============================================================================
    function App() {
      // ============================================================================
      // 【狀態宣告】useState 群
      // ============================================================================
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [dbStatus, setDbStatus] = useState('connecting');
      // v14.6.0：三重沉默可見化狀態
      const [subError, setSubError] = useState(null);             // 訂閱錯誤類型（如 permission-denied）
      const [retryNonce, setRetryNonce] = useState(0);            // 「重新連線」重跑訂閱 effect
      const [isStale, setIsStale] = useState(false);              // fromCache 偵測（連線不穩橫幅）
      const [scheduleLoaded, setScheduleLoaded] = useState(false); // 首批快照旗標（不可用資料長度判斷，空集合合法）
      const [peopleLoaded, setPeopleLoaded] = useState(false);
      const [menuLoaded, setMenuLoaded] = useState(false);
      const coreLoaded = scheduleLoaded && peopleLoaded && menuLoaded;
      const [workshopId, setWorkshopId] = useState(null);
      const [workshops, setWorkshops] = useState([]);
      const [workshopsLoading, setWorkshopsLoading] = useState(true);
      const [workshopPwdTarget, setWorkshopPwdTarget] = useState(null); // 正在輸入密碼的工坊
      const [workshopPwdInput, setWorkshopPwdInput] = useState('');
      const [workshopPwdError, setWorkshopPwdError] = useState(''); // 空字串＝無錯誤；否則為要顯示的訊息
      const [workshopPwdVerifying, setWorkshopPwdVerifying] = useState(false);
      // 系統管理面板
      const [sysAdminOpen, setSysAdminOpen] = useState(false);
      const [sysAdminAuthed, setSysAdminAuthed] = useState(false);
      const [sysAdminInput, setSysAdminInput] = useState('');
      const [sysAdminError, setSysAdminError] = useState(false);
      const [sysAdminTab, setSysAdminTab] = useState('units'); // 'units' | 'changelog'
      const [sysAdminEditTarget, setSysAdminEditTarget] = useState(null);
      const [sysAdminForm, setSysAdminForm] = useState({ id: '', label: '', label_en: '', color: '#6366f1', address: '' });
      const [targetDate, setTargetDate] = useState(getLocalDateStr());
      const [exportPdfDate, setExportPdfDate] = useState(getLocalDateStr());

      const [sysDialog, setSysDialog] = useState({ isOpen: false, title: '', msg: '', type: 'alert', onConfirm: null });
      const [showPwdModal, setShowPwdModal] = useState(false);
      const [showPeopleModal, setShowPeopleModal] = useState(false);
      const [showMonthlyModal, setShowMonthlyModal] = useState(false);
      const [historicalOrders, setHistoricalOrders] = useState([]);
      const [historicalLoading, setHistoricalLoading] = useState(false);
      const [loadedMonths, setLoadedMonths] = useState(new Set());
      const [showChangelogModal, setShowChangelogModal] = useState(false);
      const [showPreserveModal, setShowPreserveModal] = useState(false);
      const [preserveTargetDate, setPreserveTargetDate] = useState('');
      const [preserveNewShop, setPreserveNewShop] = useState('');
      const [showTrashModal, setShowTrashModal] = useState(false);
      const [trashItems, setTrashItems] = useState([]);
      const [editPriceOrder, setEditPriceOrder] = useState(null); // { id, personName, items: [{...price editable}] }
      const [showSuccess, setShowSuccess] = useState(false);
      const [printContent, setPrintContent] = useState(null); // { type, html }
      // 新增：放大圖片燈箱狀態
      const [zoomedImage, setZoomedImage] = useState(null);

      const [schedule, setSchedule] = useState({});
      const [shops, setShops] = useState([]);
      const [menuItems, setMenuItems] = useState([]);
      const [people, setPeople] = useState([]);
      const [allOrders, setAllOrders] = useState([]); 
      const [lockedDates, setLockedDates] = useState({}); 
      const [leaveMap, setLeaveMap] = useState({});       

      const [pwdInput, setPwdInput] = useState("");
      const [pwdError, setPwdError] = useState(false);
      const [selectedAdminShop, setSelectedAdminShop] = useState(null);
      const [editShopPhone, setEditShopPhone] = useState('');
      const [editShopAddress, setEditShopAddress] = useState('');
      const [newShopNameInput, setNewShopNameInput] = useState("");
      const [copySourceShop, setCopySourceShop] = useState("");

      const [editingMenuId, setEditingMenuId] = useState(null);
      const [menuForm, setMenuForm] = useState({ 
        name: '', price: '', unit: '份', category: '飯類', tag: '', image: '', 
        isVariant: false, variantSmallPrice: '', variantLargePrice: '' 
      });
      const [editingPersonId, setEditingPersonId] = useState(null);
      const [personForm, setPersonForm] = useState({ name: '', image: '', note: '', role: 'client', isFloating: false, subsidyOverride: '', categoryRules: [] });
      const [showFloatingModal, setShowFloatingModal] = useState(false);
      const [tempPersonName, setTempPersonName] = useState('');
      const [floatingDate, setFloatingDate] = useState('');
      const [floatingIds, setFloatingIds] = useState([]);
      const [floatingTemp, setFloatingTemp] = useState([]);  // [{ id, name }] 臨時訪客，session only
      const [editingRuleIdx, setEditingRuleIdx] = useState(null);
      const [ruleForm, setRuleForm] = useState({ type: 'category', value: '麵類', note: '' });

      const [selectedPerson, setSelectedPerson] = useState(null);
      const [currentDraft, setCurrentDraft] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);

      const [filterMonth, setFilterMonth] = useState(getLocalDateStr().split('/').slice(0, 2).join('/'));
      const [filterPerson, setFilterPerson] = useState('ALL');

      // ============================================================================
      // 【對話框與寫入保護】showAlert／showConfirm／safeWrite
      // ============================================================================
      const showAlert = (title, msg) => setSysDialog({ isOpen: true, title, msg, type: 'alert', onConfirm: null });
      const showConfirm = (title, msg, onConfirm) => setSysDialog({ isOpen: true, title, msg, type: 'confirm', onConfirm });
      const closeDialog = () => setSysDialog({ ...sysDialog, isOpen: false });
      // v14.8.0：Firestore 寫入統一包一層，失敗時彈「儲存失敗」＋可讀原因；
      // console 只印錯誤代碼（不印訂單內容或人名）。成功回傳 true，失敗回傳 false。
      const safeWrite = async (fn, label) => {
        try { await fn(); return true; }
        catch (err) {
          console.error('[write-failed]', label, err?.code || 'unknown');
          showAlert('儲存失敗', `${label}沒有存成功：${WRITE_ERROR_REASON[err?.code] || '請稍後再試'}。`);
          return false;
        }
      };

      // ============================================================================
      // 【資料訂閱】菜單路徑、units、認證狀態、Firestore onSnapshot
      // ============================================================================
      // 菜單路徑（依工坊 menuGroup 動態決定）
      const _activeWsForMenu = workshops.find(w => w.id === workshopId);
      const activeMenuKey = !workshopId
        ? 'shared'
        : (_activeWsForMenu?.menuGroup
            ? `group_${_activeWsForMenu.menuGroup}`
            : (_activeWsForMenu?.docId ? workshopId : 'shared'));
      const menuPath = (seg) => {
        const parts = seg.split('/');
        const base = `artifacts/${appId}/public/data/${parts[0]}_${activeMenuKey}`;
        return parts.length === 1 ? base : `${base}/${parts.slice(1).join('/')}`;
      };

      // 從 Firestore 動態載入工坊設定
      // v15.0.0：登入頁需在登入前顯示工坊清單，故 units 於未登入時即訂閱（規則層為公開讀）。
      //   有資料就整份以 Firestore 為準；只有整份讀不到或為空時，才整批啟用 fallback
      //   （不再逐 id 補齊 — 舊做法會讓 active:false 停用的工坊被 fallback 補回）
      useEffect(() => {
        const unsubscribe = onSnapshot(
          collection(db, ...unitsColPath().split('/')),
          (snap) => {
            const wsFromFirestore = snap.docs
              .filter(d => d.data().active !== false)
              .map(d => ({ docId: d.id, ...d.data() }))
              .sort((a, b) => (a.order || 0) - (b.order || 0));
            setWorkshops(wsFromFirestore.length > 0 ? wsFromFirestore : WORKSHOPS_FALLBACK);
            setWorkshopsLoading(false);
          },
          () => { setWorkshops(WORKSHOPS_FALLBACK); setWorkshopsLoading(false); }
        );
        return () => unsubscribe();
      }, []);

      // 認證狀態監聽
      // v15.0.0：Email/Password 登入後，重新整理時 SDK 會自動恢復 session。
      //   以 sessionStorage 的 8 小時 expiry 決定要不要沿用；逾時或匿名殘留一律登出。
      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (u) => {
          setUser(u);
          setDbStatus(u ? 'online' : 'offline');
          // 登出／session 失效 → 退回工坊選擇頁，並收回管理員閘門
          if (!u) { setWorkshopId(null); setIsAdmin(false); return; }
          if (!u.email) { signOut(auth).catch(() => {}); return; } // 舊版匿名帳號殘留
          const wid = u.email.split('@')[0];
          const expiry = Number(sessionStorage.getItem('ws_login_' + wid) || 0);
          if (expiry > Date.now()) {
            setWorkshopId(wid);
          } else {
            sessionStorage.removeItem('ws_login_' + wid);
            signOut(auth).catch(() => {});
          }
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user || !workshopId) return;
        // v15.0.0：登入帳號與當前工坊不匹配時不訂閱（切工坊、或殘留的舊工坊 token），
        //   避免踩到 Firestore rules 的 permission-denied
        if (user.email !== workshopId + EMAIL_DOMAIN) return;
        // v14.6.0：每次（重）訂閱時重置首批快照旗標與連線狀態（含「重新連線」重跑）
        setScheduleLoaded(false); setPeopleLoaded(false); setMenuLoaded(false);
        setIsStale(false); setSubError(null);
        let unsubscribes = [];
        try {
            const paths = {
              schedule: doc(db, ...workshopPath(workshopId, 'settings/schedule').split('/')),
              shops:    collection(db, ...menuPath('shops').split('/')),
              menu:     collection(db, ...menuPath('menu').split('/')),
              people:   collection(db, ...workshopPath(workshopId, 'people').split('/')),
              orders:   collection(db, ...workshopPath(workshopId, 'orders').split('/')),
              settings: doc(db, ...workshopPath(workshopId, 'settings/today').split('/')),
              leave:    doc(db, ...workshopPath(workshopId, 'settings/leave').split('/'))
            };

            // v14.6.0：錯誤可見化 — 記錄錯誤類型，畫面顯示錯誤橫幅＋「重新連線」按鈕（不再只默默設 offline）
            const handleError = (e) => { setDbStatus('offline'); setSubError(e?.code || 'unknown'); };

            // 自動清理：刪除超過 SOFT_DELETE_KEEP_MS 的軟刪除資料
            const cleanupSoftDeleted = async () => {
              const cutoff = Timestamp.fromMillis(Date.now() - SOFT_DELETE_KEEP_MS);
              const collectionsToClean = [
                collection(db, ...menuPath('shops').split('/')),
                collection(db, ...menuPath('menu').split('/')),
                collection(db, ...workshopPath(workshopId, 'people').split('/')),
                collection(db, ...workshopPath(workshopId, 'orders').split('/')),
              ];
              await Promise.all(collectionsToClean.map(async (col) => {
                try {
                  const snap = await getDocs(query(col, where('deletedAt', '<=', cutoff)));
                  await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
                } catch(e) { /* ignore */ }
              }));
            };
            cleanupSoftDeleted();

            // v14.6.0：schedule 為代表性訂閱，加 metadata 偵測 fromCache（連線不穩橫幅）。
            // metadata-only 回呼變多：isStale / schedule 都先比對值有變才換新值，避免無謂 render
            unsubscribes.push(onSnapshot(paths.schedule, { includeMetadataChanges: true }, (s) => {
              if (!s.metadata.fromCache) setDbStatus('online'); // 快取快照不代表連線恢復
              setIsStale(prev => prev === s.metadata.fromCache ? prev : s.metadata.fromCache);
              setScheduleLoaded(true);
              const data = s.exists() ? s.data() : {};
              setSchedule(prev => JSON.stringify(prev) === JSON.stringify(data) ? prev : data);
            }, handleError));
            unsubscribes.push(onSnapshot(paths.shops,    (s) => setShops(s.docs.filter(d => !d.data().deletedAt).map(d => ({ id: d.id, ...d.data() }))), handleError));
            unsubscribes.push(onSnapshot(paths.menu,     (s) => { setMenuLoaded(true); setMenuItems(s.docs.filter(d => !d.data().deletedAt).map(d => ({ id: d.id, ...d.data() }))); }, handleError));
            unsubscribes.push(onSnapshot(paths.people,   (s) => { setPeopleLoaded(true); setPeople(s.docs.filter(d => !d.data().deletedAt).map(d => ({ id: d.id, ...d.data() }))); }, handleError));
            unsubscribes.push(onSnapshot(
              query(paths.orders, where('timestamp', '>=', Date.now() - 31*24*60*60*1000)),
              (s) => setAllOrders(s.docs.filter(d => !d.data().deletedAt).map(d => ({ id: d.id, ...d.data() }))),
              handleError
            ));

            // 垃圾桶：初始載入（使用 component-level loadTrash）
            loadTrash();
            unsubscribes.push(onSnapshot(paths.settings, (s) => {
              if (s.exists()) {
                setLockedDates(s.data().lockedDates || {});
                const todayStr = getLocalDateStr();
                if (s.data().floatingDate === todayStr) {
                  setFloatingDate(todayStr);
                  setFloatingIds(s.data().floatingIds || []);
                } else {
                  setFloatingDate(todayStr);
                  setFloatingIds([]);
                }
              }
            }, handleError));
            unsubscribes.push(onSnapshot(paths.leave,    (s) => { if (s.exists()) setLeaveMap(s.data()); }, handleError));
        } catch(e) { setDbStatus('offline'); setSubError(e?.code || 'subscribe-failed'); }
        return () => unsubscribes.forEach(unsub => unsub && unsub());
      }, [user, workshopId, activeMenuKey, retryNonce]);

      // ============================================================================
      // 【衍生資料】今日訂單、進度、彙總、補貼計算
      // ============================================================================
      const upcomingDates = useMemo(() => {
          const dates = []; let d = new Date();
          while(dates.length < 10) { 
              const day = d.getDay();
              if(day !== 0 && day !== 6) dates.push(new Date(d));
              d.setDate(d.getDate() + 1);
          }
          return dates;
      }, []);

      useEffect(() => {
          if (!isAdmin && upcomingDates.length > 0) {
              const allowedDates = upcomingDates.slice(0, 3).map(d => getLocalDateStr(d));
              if (!allowedDates.includes(targetDate)) setTargetDate(allowedDates[0]);
          }
      }, [isAdmin, upcomingDates, targetDate]);

      const availableExportDates = useMemo(() => {
          const dates = new Set(allOrders.map(o => o.dateStr));
          dates.add(targetDate); 
          return Array.from(dates).sort((a,b) => new Date(b) - new Date(a));
      }, [allOrders, targetDate]);

      const orders = useMemo(() => allOrders.filter(o => o.dateStr === targetDate), [allOrders, targetDate]);
      const leaveIds = leaveMap[targetDate] || [];
      const dayFinished = lockedDates[targetDate] || false;
      const activeShop = schedule[targetDate] || "";
      const activeShopDetails = shops.find(s => s.name === activeShop) || { phone: '', address: '' };
      
      const exportOrders = useMemo(() => allOrders.filter(o => o.dateStr === exportPdfDate), [allOrders, exportPdfDate]);
      const exportShopName = schedule[exportPdfDate] || '未排程';
      const exportShopDetails = shops.find(s => s.name === exportShopName) || { phone: '' };

      const SPECIAL_SCHEDULES = ['料理組準備', '社區適應', '國定假日'];
      const allShopNames = useMemo(() => {
          return Array.from(new Set([...shops.map(s => s.name), ...SPECIAL_SCHEDULES])).filter(Boolean);
      }, [shops]);

      // 補貼金額：從工坊設定讀取，預設 70
      const subsidyAmount = useMemo(() => {
        const ws = workshops.find(w => w.id === workshopId);
        return ws?.subsidyAmount ?? 70;
      }, [workshops, workshopId]);

      // 今日可見人員 = 非浮動人員 + 今日已啟用浮動人員 + 臨時訪客
      const activePeopleList = useMemo(() => {
        const todayStr = getLocalDateStr();
        const normal = people.filter(p => !p.isFloating);
        const floatingActive = (floatingDate === todayStr)
          ? people.filter(p => p.isFloating && floatingIds.includes(p.id))
          : [];
        return [...normal, ...floatingActive, ...floatingTemp];
      }, [people, floatingDate, floatingIds, floatingTemp]);

      // 只有服務對象享有補貼；個人 subsidyOverride 優先，否則用工坊預設
      const getPersonSubsidy = (personId) => {
          const p = [...people, ...floatingTemp].find(x => x.id === personId);
          if (p?.role !== 'client') return 0;
          return (p.subsidyOverride != null && p.subsidyOverride !== '') ? Number(p.subsidyOverride) : subsidyAmount;
      };

      const progress = useMemo(() => {
        const visiblePeople = activePeopleList.filter(p => !leaveIds.includes(p.id));
        const completed = visiblePeople.filter(p => orders.some(o => o.personId === p.id)).length;
        return { count: visiblePeople.length, done: completed, finished: visiblePeople.length > 0 && completed === visiblePeople.length };
      }, [activePeopleList, leaveIds, orders]);

      const summaryList = useMemo(() => {
          const list = [];
          activePeopleList.forEach(p => {
              const isLeave = leaveIds.includes(p.id);
              const order = orders.find(o => o.personId === p.id);
              if (isLeave || order) list.push({ person: p, isLeave, order });
          });
          return list.sort((a, b) => roleSort(a.person, b.person));
      }, [activePeopleList, leaveIds, orders]);

      const exportSummaryList = useMemo(() => {
          const list = [];
          people.forEach(p => {
              const order = exportOrders.find(o => o.personId === p.id);
              if (order) list.push({ person: p, order });
          });
          return list.sort((a, b) => roleSort(a.person, b.person));
      }, [people, exportOrders]);

      const exportTotals = useMemo(() => {
          let grandTotal = 0, totalDiff = 0;
          exportSummaryList.forEach(({person, order}) => {
              if (order) {
                  const subsidy = getPersonSubsidy(person.id);
                  const diff = Math.max(0, order.grandTotal - subsidy);
                  grandTotal += order.grandTotal;
                  if (order.grandTotal > 0) totalDiff += diff;
              }
          });
          return { grandTotal, totalDiff };
      }, [exportSummaryList]);

      const aggregatedData = useMemo(() => {
        const summary = {}; let grandTotal = 0, totalDiff = 0;
        orders.forEach(order => {
          const subsidy = getPersonSubsidy(order.personId);
          if (order.grandTotal > 0) totalDiff += Math.max(0, order.grandTotal - subsidy);
          
          (order.items || []).forEach(item => {
            let rawUnit = (item.unit || '份').trim();
            let aggName = item.name;
            let aggCount = item.quantity;
            let aggUnit = rawUnit;
            
            if (['顆', '粒', '個'].includes(rawUnit) && item.quantity > 0) {
                aggName = `${item.name}(${item.quantity}${rawUnit})`;
                aggCount = 1;
                aggUnit = '份';
            }
            
            if (!summary[aggName]) summary[aggName] = { name: aggName, count: 0, price: item.price, total: 0, unit: aggUnit, category: item.category || '其他' };
            summary[aggName].count += aggCount; 
            summary[aggName].total += item.total; 
            grandTotal += item.total;
          });
        });
        return { items: Object.values(summary), grandTotal, totalDiff };
      }, [orders, people]);

      // ============================================================================
      // 【月報資料】31 天窗口與按需補撈
      // ============================================================================
      // 31 天窗口起始時間（早於此 timestamp 的訂單不在 allOrders 訂閱範圍內）
      const windowStartMs = useMemo(() => Date.now() - 31*24*60*60*1000, [showMonthlyModal]);

      // 判斷某月份（YYYY/M）是否完全落在 31 天窗口內
      const monthInWindow = (ym) => {
          const [y, m] = ym.split('/').map(Number);
          const monthStartMs = new Date(y, m - 1, 1).getTime();
          return monthStartMs >= windowStartMs;
      };

      // 切換月份時，若超出 31 天窗口且未載入過，按需 getDocs 撈取
      useEffect(() => {
          if (!showMonthlyModal || !workshopId) return;
          if (monthInWindow(filterMonth)) return;
          if (loadedMonths.has(filterMonth)) return;
          const [y, m] = filterMonth.split('/').map(Number);
          const startMs = new Date(y, m - 1, 1).getTime();
          const endMs = new Date(y, m, 1).getTime() - 1;
          setHistoricalLoading(true);
          (async () => {
              try {
                  const snap = await getDocs(query(
                      collection(db, ...workshopPath(workshopId, 'orders').split('/')),
                      where('timestamp', '>=', startMs),
                      where('timestamp', '<=', endMs)
                  ));
                  const fetched = snap.docs.filter(d => !d.data().deletedAt).map(d => ({ id: d.id, ...d.data() }));
                  setHistoricalOrders(prev => {
                      const existingIds = new Set(prev.map(o => o.id));
                      return [...prev, ...fetched.filter(o => !existingIds.has(o.id))];
                  });
                  setLoadedMonths(prev => new Set(prev).add(filterMonth));
              } catch (e) { /* ignore */ }
              finally { setHistoricalLoading(false); }
          })();
      }, [filterMonth, showMonthlyModal, workshopId]);

      const availableMonths = useMemo(() => {
          const months = new Set();
          allOrders.forEach(o => {
              const parts = o.dateStr.split('/');
              months.add(`${parts[0]}/${parts[1]}`);
          });
          historicalOrders.forEach(o => {
              const parts = o.dateStr.split('/');
              months.add(`${parts[0]}/${parts[1]}`);
          });
          months.add(getLocalDateStr().split('/').slice(0, 2).join('/'));
          months.add(filterMonth); // 確保目前選的月份可選（即使尚無資料）
          return Array.from(months).sort((a,b) => b.localeCompare(a, undefined, {numeric: true}));
      }, [allOrders, historicalOrders, filterMonth]);

      const monthlyData = useMemo(() => {
          const combinedMap = new Map();
          allOrders.forEach(o => combinedMap.set(o.id, o));
          historicalOrders.forEach(o => { if (!combinedMap.has(o.id)) combinedMap.set(o.id, o); });
          const monthOrders = Array.from(combinedMap.values()).filter(o => o.dateStr.startsWith(filterMonth + '/'));
          
          if (filterPerson === 'ALL') {
              const stats = people.map(p => {
                  const personOrders = monthOrders.filter(o => o.personId === p.id);
                  const hasSubsidy = p.role === 'client';
                  const personSubsidy = hasSubsidy ? ((p.subsidyOverride != null && p.subsidyOverride !== '') ? Number(p.subsidyOverride) : subsidyAmount) : 0;
                  const totalSpent = personOrders.reduce((sum, o) => sum + o.grandTotal, 0);
                  const totalSubsidy = personOrders.reduce((sum, o) => (o.grandTotal > 0 && hasSubsidy) ? sum + personSubsidy : sum, 0);
                  return { person: p, totalSpent, toPay: Math.max(0, totalSpent - totalSubsidy), orderCount: personOrders.filter(o => o.grandTotal > 0).length };
              });
              return {
                  mode: 'summary', currentMonthStr: filterMonth,
                  stats: stats.filter(s => s.orderCount > 0).sort((a,b) => roleSort(a.person, b.person))
              };
          } else {
              const p = people.find(x => x.id === filterPerson);
              const hasSubsidy = p?.role === 'client';
              const personSubsidy = hasSubsidy ? ((p?.subsidyOverride != null && p?.subsidyOverride !== '') ? Number(p.subsidyOverride) : subsidyAmount) : 0;
              const personOrders = monthOrders.filter(o => o.personId === filterPerson).sort((a, b) => new Date(a.dateStr) - new Date(b.dateStr));
              let monthTotalSpent = 0; let monthTotalDiff = 0;
              const details = personOrders.map(o => {
                  const subsidy = personSubsidy;
                  const diff = Math.max(0, o.grandTotal - subsidy);
                  monthTotalSpent += o.grandTotal;
                  if (o.grandTotal > 0) monthTotalDiff += diff;
                  const shopName = schedule[o.dateStr] || '未記錄';
                  return { date: o.dateStr, shop: shopName, items: o.items, grandTotal: o.grandTotal, diff, isNoOrder: o.grandTotal === 0 && o.items.length === 0 };
              });
              return { mode: 'detail', person: p, currentMonthStr: filterMonth, details, monthTotalSpent, monthTotalDiff };
          }
      }, [allOrders, historicalOrders, filterMonth, filterPerson, people, schedule, subsidyAmount]);

      // ============================================================================
      // 【管理員驗證】獨立 instance 驗過即登出
      // ============================================================================
      // v15.0.0：管理員密碼以獨立 instance 向 Firebase Auth 驗證，驗過即登出該 instance，
      //   不影響工坊登入狀態；管理員身分僅為前端閘門（資料層權限由工坊帳號決定）
      const handleAdminAuth = async (e) => {
        e?.preventDefault();
        try {
          await signInWithEmailAndPassword(adminVerifyAuth, 'admin' + EMAIL_DOMAIN, pwdInput);
          await signOut(adminVerifyAuth).catch(() => {});
          setIsAdmin(true); setShowPwdModal(false); setPwdInput(""); setPwdError(false);
        } catch (err) {
          setPwdError(true);
        }
      };

      // ============================================================================
      // 【訂單編輯】菜單／店家／人員規則編輯、品項增減、送出與封存
      // ============================================================================
      const resetMenuForm = () => {
          setEditingMenuId(null);
          setMenuForm({ name: '', price: '', unit: '份', category: '飯類', tag: '', image: '', isVariant: false, variantSmallPrice: '', variantLargePrice: '' });
      };

      const startEditMenu = (item) => {
        setEditingMenuId(item.id);
        setMenuForm({
          name: item.name, price: item.price || '', category: item.category || '飯類', unit: item.unit || '份', tag: item.tag || '', image: item.image || '',
          isVariant: item.isVariant || false, variantSmallPrice: item.variants?.[0]?.price || '', variantLargePrice: item.variants?.[1]?.price || ''
        });
      };

      const openShopModal = (shopName) => {
          setSelectedAdminShop(shopName);
          const s = shops.find(x => x.name === shopName);
          setEditShopPhone(s?.phone || '');
          setEditShopAddress(s?.address || '');
          resetMenuForm();
      };

      const saveShopDetails = async () => {
        try {
            const targetShop = shops.find(s => s.name === selectedAdminShop);
            if (targetShop && targetShop.id) { await updateDoc(doc(db, ...menuPath('shops').split('/'), targetShop.id), { phone: editShopPhone, address: editShopAddress }); } 
            else { await setDoc(doc(db, ...menuPath('shops').split('/'), selectedAdminShop), { name: selectedAdminShop, phone: editShopPhone, address: editShopAddress }, { merge: true }); }
            showAlert("成功", "店家資料已儲存");
        } catch (e) { showAlert('錯誤', '儲存失敗'); }
      };

      const saveMenuAction = async () => {
        if (!menuForm.name) return showAlert('提示', '請輸入品項名稱');
        try {
          const payload = { ...menuForm, shop: selectedAdminShop };
          if (menuForm.isVariant) {
            payload.variants = [{label:'小', price: Number(menuForm.variantSmallPrice)}, {label:'大', price: Number(menuForm.variantLargePrice)}];
            payload.price = 0;
          } else {
            payload.price = Number(menuForm.price);
            payload.variants = null;
          }
          if (editingMenuId) await updateDoc(doc(db, ...menuPath('menu/' + editingMenuId).split('/')), payload);
          else await addDoc(collection(db, ...menuPath('menu').split('/')), { ...payload, createdAt: Date.now() });
          resetMenuForm();
          setShowSuccess(true); setTimeout(() => setShowSuccess(false), 2000);
        } catch (e) { showAlert('錯誤', '儲存失敗。'); }
      };

      const handleDeleteShop = (shopName) => {
        showConfirm('刪除店家', `確定要刪除店家「${shopName}」及其所有菜單嗎？（資料保留 5 天可還原）`, async () => {
            const now = Timestamp.now();
            const shopDocs = shops.filter(s => s.name === shopName);
            for (const sDoc of shopDocs) await updateDoc(doc(db, ...menuPath('shops').split('/'), sDoc.id), { deletedAt: now });
            const itemsToDelete = menuItems.filter(m => m.shop === shopName);
            for (const item of itemsToDelete) await updateDoc(doc(db, ...menuPath('menu/' + item.id).split('/')), { deletedAt: now });
            setSelectedAdminShop(null);
        });
      };

      const copyMenuFromShop = (sourceShopName) => {
        if (!sourceShopName || sourceShopName === selectedAdminShop) return;
        showConfirm('複製菜單', `確定要將「${sourceShopName}」的菜單複製到「${selectedAdminShop}」嗎？（不會刪除現有品項）`, async () => {
          const sourceItems = menuItems.filter(m => m.shop === sourceShopName);
          if (sourceItems.length === 0) { showAlert('提示', '來源店家尚無菜單品項。'); return; }
          try {
            for (const item of sourceItems) {
              const { id, ...payload } = item;
              await addDoc(collection(db, ...menuPath('menu').split('/')), { ...payload, shop: selectedAdminShop, createdAt: Date.now() });
            }
            showAlert('成功', `已成功複製 ${sourceItems.length} 個品項！`);
          } catch (e) { showAlert('錯誤', '複製失敗，請重試。'); }
        });
      };

      const startEditPerson = (p) => {
          setEditingPersonId(p.id);
          setPersonForm({ name: p.name, image: p.image || '', note: p.note || '', role: p.role || 'client', isFloating: p.isFloating || false, subsidyOverride: p.subsidyOverride ?? '', categoryRules: p.categoryRules || [] });
          setEditingRuleIdx(null);
          setRuleForm({ type: 'category', value: '麵類', note: '' });
      };

      const savePersonAction = async () => {
          if (!personForm.name) return showAlert('提示', '請輸入姓名');

      const processImage = (file, type = 'menu') => new Promise((resolve, reject) => {
        const MAX_SIZE = type === 'menu' ? 800 : 500;
        const QUALITY  = type === 'menu' ? 0.85 : 0.80;
        setUploadingImage(true);
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > h) { if (w > MAX_SIZE) { h = Math.round(h * MAX_SIZE / w); w = MAX_SIZE; } }
            else        { if (h > MAX_SIZE) { w = Math.round(w * MAX_SIZE / h); h = MAX_SIZE; } }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const b64 = canvas.toDataURL('image/jpeg', QUALITY);
            setUploadingImage(false);
            resolve(b64);
          };
          img.onerror = () => { setUploadingImage(false); reject(new Error('圖片載入失敗')); };
          img.src = e.target.result;
        };
        reader.onerror = () => { setUploadingImage(false); reject(new Error('檔案讀取失敗')); };
        reader.readAsDataURL(file);

        return (

            {/* 進度橫幅 — 對齊健康管理系統：左標題、中進度條（含飯糰圖示）、右人數 */}

                            justifyContent: 'center',

                            border: `2px solid ${isDone ? '#10b981' : '#f97316'}`,

                          <div style={{
                            position:'absolute', top:0, left:0, bottom:0,
                            width: `${Math.min(pct, 100)}%`,

                            transition:'width 0.7s ease'
                          }} />

                  <div className="flex items-center gap-3 text-white">
                    <div className="w-11 h-11 bg-white/20 rounded-[10px] flex items-center justify-center shrink-0">
                      <Check size={24} strokeWidth={3} className="text-white"/>
                    </div>
                    <div>
                      <p className="font-bold text-lg leading-tight">所有人員已完成點餐！</p>
                      <p className="text-green-200 text-sm mt-0.5">{progress.count} 人 · {activeShop}</p>
                    </div>
                  </div>
                  <button onClick={lockTodayOrders}
                    className="px-7 py-3 bg-white text-green-700 rounded-[10px] font-bold text-base shadow-sm border border-soft-gray hover:bg-green-50 active:scale-95 transition-all flex items-center gap-2 shrink-0">
                    <Check size={20} strokeWidth={3}/>確認完成今日作業
                  </button>

            )}

            {/* 今日訪客按鈕：有浮動人員才顯示 */}
            {people.some(p => p.isFloating) && (
              <div className="flex justify-end">

                  className="flex items-center gap-1.5 px-4 py-2 bg-amber-50 text-amber-700 border border-amber-200 rounded-[10px] text-sm font-semibold hover:bg-amber-100 transition-colors shadow-sm">
                  <UserPlus size={15}/> 今日訪客（含不固定人員）新增
                  {(floatingIds.length + floatingTemp.length) > 0 && (
                    <span className="bg-amber-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">{floatingIds.length + floatingTemp.length}</span>
                  )}

              </div>
            )}

            {/* 人員卡片格 */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
              {[...activePeopleList].sort(roleSort).map(p => {
                const order = orders.find(o => o.personId === p.id); const isLeave = leaveIds.includes(p.id);

                      style={ isOrderCompleted && !isNoOrder ? { background: 'linear-gradient(135deg, #f0fdf4, #dcfce7)' } : {}}>

                      <div className={`w-[100px] h-[100px] rounded-full overflow-hidden border-4 border-white shadow-sm border border-soft-gray shrink-0 flex items-center justify-center text-3xl font-bold text-white ${
                        isLeave ? 'bg-slate-300' :
                        isNoOrder ? 'bg-slate-400' :
                        isOrderCompleted ? 'bg-green-400' : 'bg-orange-400'
                      }`}>
                        {p.image ? <img src={p.image} className="w-full h-full object-cover" /> : p.name[0]}
                      </div>
                      <span className="text-sm font-bold text-charcoal px-2 text-center leading-tight">{p.name}</span>
                      {isNoOrder && <div className="bg-slate-100 text-subtle-ash text-xs font-bold px-3 py-1 rounded-full border border-soft-gray">不點餐</div>}
                      {isOrderCompleted && !isNoOrder && (
                        <div className="absolute top-3 right-3 w-8 h-8 bg-green-500 rounded-full flex items-center justify-center shadow-sm border border-soft-gray border-2 border-white">
                          <Check size={16} strokeWidth={4} className="text-white"/>
                        </div>
                      )}
                      {p.note && !isOrderCompleted && (
                        <div className="absolute top-3 left-3 w-7 h-7 bg-red-500 rounded-full flex items-center justify-center shadow-sm border border-soft-gray" title={p.note}>
                          <AlertCircle size={16} className="text-white" strokeWidth={2.5}/>
                        </div>
                      )}
                    </button>
                    <div className="flex gap-1.5">
                      {/* v14.7.0：已點餐/不點餐後隱藏「請假」防誤觸（同「不點餐」鈕慣例）；訂單刪除或取消不點後隨快照自動恢復；請假中仍顯示「取消請假」 */}
                      {(!isOrderCompleted || isLeave) && (
                        <button type="button" onClick={() => toggleLeave(p.id)}
                          className={`flex-1 text-xs py-2 rounded-[10px] border font-semibold transition-all ${isLeave ? 'bg-orange-100 text-orange-600 border-orange-300' : 'bg-white text-subtle-ash border-soft-gray hover:bg-orange-50 hover:border-orange-200'}`}>
                          {isLeave ? "取消請假" : "請假"}

                      )}
                      {!isLeave && activeShop && !isOrderCompleted && (
                        <button type="button" onClick={() => handleDirectNoOrder(p)}
                          className="flex-1 text-xs py-2 rounded-[10px] border border-soft-gray bg-paper text-subtle-ash font-semibold hover:bg-slate-100 transition-all">
                          不點餐
                        </button>
                      )}
                      {!isLeave && activeShop && isNoOrder && (
                        <button type="button" onClick={() => handleDeleteIndividualOrder(order.id, p.name, true)}
                          className="flex-1 text-xs py-2 rounded-[10px] border border-red-200 bg-red-50 text-red-500 font-semibold hover:bg-red-100 transition-all">
                          取消不點

                    </div>
                  </div>
                );
              })}
            </div>
            </>
            )}
          </div>

      };

      // ============================================================================
      // 【畫面：工坊選擇與登入頁】
      // ============================================================================
      // 工坊尚未選擇時，顯示選擇頁（含數字鍵盤密碼驗證）
      // v15.0.0：登入即發生在此頁，故不再要求 user 存在
      if (!workshopId) {
        const handleWorkshopSelect = (w) => {
          setWorkshopPwdTarget(w);
          setWorkshopPwdInput('');
          setWorkshopPwdError('');
        };
        const handlePinPress = async (val) => {
          if (workshopPwdVerifying) return;
          if (workshopPwdError) setWorkshopPwdError('');
          if (val === 'del') {
            setWorkshopPwdInput(prev => prev.slice(0, -1));
          } else if (val === 'clear') {
            setWorkshopPwdInput('');
          } else if (val === 'confirm') {
            if (!workshopPwdInput || !workshopPwdTarget) return;
            setWorkshopPwdVerifying(true);
            // v15.0.0：PIN 即 Firebase 帳號密碼，由伺服器端驗證（前端不再持有任何 hash）
            const wid = workshopPwdTarget.id;
            const sessionKey = 'ws_login_' + wid;
            try {
              // expiry 必須先寫：onAuthStateChanged 會在 signIn 的 promise resolve「之前」
              // 就被觸發，屆時若讀不到 expiry 會判定為逾時而立刻登出
              sessionStorage.setItem(sessionKey, String(Date.now() + SESSION_DURATION));
              await signInWithEmailAndPassword(auth, wid + EMAIL_DOMAIN, workshopPwdInput);
              setWorkshopPwdVerifying(false);
              setTimeout(() => {
                setWorkshopId(wid);
                setWorkshopPwdTarget(null);
                setWorkshopPwdInput('');
              }, 200);
            } catch (err) {
              // 錯誤訊息不區分「帳號不存在」與「密碼錯誤」，避免洩漏帳號是否存在
              sessionStorage.removeItem(sessionKey);
              setWorkshopPwdVerifying(false);
              setWorkshopPwdError(err?.code === 'auth/too-many-requests'
                ? '嘗試次數過多，請稍後再試'
                : '密碼錯誤，請重試');
              setTimeout(() => { setWorkshopPwdInput(''); setWorkshopPwdError(''); }, 800);
            }
          } else {
            setWorkshopPwdInput(prev => prev.length < 12 ? prev + val : prev);
          }
        };

        const PIN_KEYS = [
          ['1','2','3'],
          ['4','5','6'],
          ['7','8','9'],
          ['clear','0','del'],
        ];

        const workshopIcons = {
          sunny: (<svg viewBox="0 0 64 64" width="52" height="52" fill="none"><circle cx="32" cy="32" r="32" fill="#fff7ed"/><path d="M32 48 C24 38 16 30 20 20 C24 12 36 14 32 24 C28 14 40 12 44 20 C48 30 40 38 32 48Z" fill="#f97316" opacity="0.85"/><path d="M32 46 C32 34 26 28 28 20" stroke="#ea580c" strokeWidth="1.5" strokeLinecap="round" fill="none"/></svg>),
          river: (<svg viewBox="0 0 64 64" width="52" height="52" fill="none"><circle cx="32" cy="32" r="32" fill="#eef2ff"/><path d="M32 14 L38 26 L52 28 L42 38 L44 52 L32 46 L20 52 L22 38 L12 28 L26 26 Z" fill="#6366f1" opacity="0.9"/><circle cx="32" cy="32" r="5" fill="white" opacity="0.8"/></svg>),
        };
        const getWorkshopIcon = (w) => {
          if (workshopIcons[w.id]) return workshopIcons[w.id];
          const letter = (w.label || '?').charAt(0);
          const c = w.color || '#6366f1';
          return (<svg viewBox="0 0 64 64" width="52" height="52"><circle cx="32" cy="32" r="32" fill={c + '22'}/><text x="32" y="41" textAnchor="middle" fontSize="26" fontWeight="bold" fill={c}>{letter}</text></svg>);
        };

        // ── 系統管理員 handlers ──
        const handleSysAdminOpen = () => { setSysAdminOpen(true); setSysAdminInput(''); setSysAdminError(false); setSysAdminAuthed(false); setSysAdminTab('units'); };
        // v15.0.0：關閉面板時登出 sysadmin instance，面板外不保留其寫入權限
        const handleSysAdminClose = () => {
          setSysAdminOpen(false); setSysAdminAuthed(false); setSysAdminInput(''); setSysAdminError(false); setSysAdminEditTarget(null);
          signOut(sysAdminAuth).catch(() => {});
        };
        // v15.0.0：主密碼即 sysadmin 帳號密碼，由 Firebase Auth 驗證。
        //   面板開啟期間維持登入 — 面板內的 units 寫入走 sysAdminDb（該 instance 的 Firestore）
        const handleSysAdminAuth = async (e) => {
          e?.preventDefault();
          if (!sysAdminInput) return;
          try {
            await signInWithEmailAndPassword(sysAdminAuth, 'sysadmin' + EMAIL_DOMAIN, sysAdminInput);
            setSysAdminAuthed(true); setSysAdminTab('units'); setSysAdminInput(''); setSysAdminError(false);
          } catch(err) { setSysAdminError(true); setSysAdminInput(''); }
        };
        // 從 fallback 補齊基本欄位（文件不存在時自動建立）
        const wsBaseFields = (w) => w.docId ? {} : {
          id: w.id, label: w.label, label_en: w.label_en || '',
          color: w.color || '#6366f1', address: w.address || '',
          menuGroup: w.menuGroup || '', active: true
        };
        // 一鍵遷移：shops_shared / menu_shared → _group_{groupId}，並更新所有工坊的 menuGroup
        const handleMigrateSharedMenu = async (groupId) => {
          if (!groupId) return;
          if (!window.confirm(`確定要將資料遷移到群組「${groupId}」？此操作完成後舊資料保留，但不可撤銷。`)) return;
          try {
            const copy = async (fromCol, toCol) => {
              const snap = await getDocs(collection(sysAdminDb, ...sharedColPath(fromCol).split('/')));
              for (const d of snap.docs) {
                await setDoc(doc(sysAdminDb, ...`artifacts/${appId}/public/data/${toCol}_group_${groupId}`.split('/'), d.id), d.data());
              }
              return snap.size;
            };
            const shopCount = await copy('shops', 'shops');
            const menuCount = await copy('menu', 'menu');
            // 更新所有工坊，設定 menuGroup
            for (const w of workshops) {
              const wsDocId = w.docId || w.id;
              await setDoc(doc(sysAdminDb, ...unitsColPath().split('/'), wsDocId),
                { ...wsBaseFields(w), menuGroup: groupId }, { merge: true });
            }
            showAlert('成功', `遷移完成！店家 ${shopCount} 筆、菜單 ${menuCount} 筆 → 群組「${groupId}」`);
          } catch(err) { showAlert('錯誤', '遷移失敗：' + err.message); }
        };
        const handleToggleActive = async (w) => {
          try {
            await setDoc(doc(sysAdminDb, ...unitsColPath().split('/'), w.docId || w.id),
              { ...wsBaseFields(w), active: w.active === false }, { merge: true });
          } catch(err) { showAlert('錯誤', '更新失敗'); }
        };
        const handleSaveUnit = async (w, fields) => {
          if (!fields.label?.trim()) return;
          try {
            await setDoc(doc(sysAdminDb, ...unitsColPath().split('/'), w.docId || w.id),
              { ...wsBaseFields(w), ...fields }, { merge: true });
            setSysAdminEditTarget(null);
          } catch(err) { showAlert('錯誤', '更新失敗'); }
        };
        const handleAddUnit = async (e) => {
          e?.preventDefault();
          const { id, label, label_en, color, address } = sysAdminForm;

          const newId = id.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
          try {
            const existing = await getDoc(doc(sysAdminDb, ...unitsColPath().split('/'), newId));
            if (existing.exists()) { showAlert('錯誤', '此 ID 已存在'); return; }
            await setDoc(doc(sysAdminDb, ...unitsColPath().split('/'), newId), {
              id: newId, label: label.trim(), label_en: label_en.trim(), color: color || '#6366f1',
              address: address.trim(), active: true, order: workshops.length
            });
            setSysAdminForm({ id: '', label: '', label_en: '', color: '#6366f1', address: '' });
            showAlert('成功', `已新增 ${label}（登入密碼請於 Firebase 後台建立 ${newId}${EMAIL_DOMAIN} 帳號）`);

                          transition:'box-shadow 0.18s, border-color 0.18s, transform 0.15s',
                          textAlign:'left'

                        onMouseLeave={e => { e.currentTarget.style.borderColor = '#e5e2de'; e.currentTarget.style.boxShadow = '0 1px 4px rgba(37,34,30,0.06)'; e.currentTarget.style.transform = 'translateY(0)'; }}>

                      </button>

                          <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-[10px] font-bold hover:bg-blue-700 transition-colors">登入</button>
                        </form>
                      </div>
                    ) : (
                      /* 主面板 */
                      <div className="space-y-6">
                        <div className="flex gap-2 border-b">
                          {[['units','單位管理'],['changelog','版本紀錄']].map(([t,lbl]) => (

                              className={`px-4 py-2 text-sm font-medium border-b-2 transition-colors -mb-px ${sysAdminTab===t ? 'border-blue-500 text-blue-600' : 'border-transparent text-subtle-ash hover:text-charcoal'}`}>
                              {lbl}
                            </button>
                          ))}
                        </div>

                        {sysAdminTab === 'units' && (
                          <div className="space-y-3">
                            {/* 遷移提示：當有工坊尚未設定 menuGroup 時顯示 */}

                              <details className="group">
                                <summary className="cursor-pointer px-4 py-2.5 bg-blue-50 text-blue-700 rounded-[10px] text-sm font-medium hover:bg-blue-100 transition-colors list-none flex items-center gap-2 select-none border border-blue-100">
                                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                  有工坊尚未設定菜單群組 — 點此執行資料遷移

                                <div className="mt-2 p-4 bg-blue-50 rounded-[10px] border border-blue-100 space-y-3">
                                  <p className="text-xs text-blue-600">將現有共用店家/菜單資料一次性複製到指定群組，並自動更新所有工坊的菜單群組設定。舊資料保留不刪。</p>
                                  <div className="flex gap-2 items-end">

                                    <button type="button" onClick={() => { const el = document.getElementById('migrateGroupIdInput'); handleMigrateSharedMenu((el?.value || '').trim() || 'tainan-central'); }} className="px-4 py-2 bg-blue-600 text-white rounded-[10px] text-sm font-bold hover:bg-blue-700 transition-colors whitespace-nowrap">開始遷移</button>

                                <div className="w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: w.color||'#6366f1' }}/>
                                {sysAdminEditTarget === (w.docId||w.id) ? (
                                  <form className="flex-1 space-y-2" onSubmit={e => {

                <button onClick={() => setShowChangelogModal(false)} className="absolute top-4 right-4 p-2 bg-slate-100 rounded-full text-subtle-ash hover:bg-slate-200 transition-colors"><X size={16}/></button>
                <h2 className="text-lg font-bold text-charcoal flex items-center gap-2 mb-5"><Clock className="text-subtle-ash" size={18}/> 版本更新紀錄</h2>
                <div className="space-y-4">
                  {CHANGELOG.map((log, idx) => (
                    <div key={log.version} className="flex gap-4">
                      <div className="shrink-0 text-right w-20">
                        <div className={`text-sm font-bold ${idx === 0 ? 'text-orange-500' : 'text-subtle-ash'}`}>{log.version}</div>
                        <div className="text-xs text-subtle-ash">{log.date}</div>
                      </div>
                      <div className="flex-1 border-l-2 border-soft-gray pl-4 pb-4">
                        <ul className="space-y-1">
                          {log.changes.map((c, i) => (
                            <li key={i} className="text-sm text-charcoal flex items-start gap-1.5">
                              <span className={`mt-1.5 shrink-0 w-1.5 h-1.5 rounded-full ${idx === 0 ? 'bg-orange-400' : 'bg-slate-300'}`}></span>
                              {c}
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {editPriceOrder && (
            <div className="fixed inset-0 bg-black/60 z-[130] flex items-center justify-center p-4 animate-in fade-in">
              <div className="bg-white rounded-[10px] p-6 w-full max-w-md shadow-2xl relative">
                <button type="button" onClick={() => setEditPriceOrder(null)} className="absolute top-4 right-4 text-subtle-ash hover:text-charcoal"><X size={20}/></button>
                <h3 className="text-base font-bold text-charcoal mb-1">編輯金額</h3>
                <p className="text-sm text-subtle-ash mb-4">{editPriceOrder.personName}</p>
                <div className="space-y-3 mb-5">
                  {editPriceOrder.items.map((item, idx) => (
                    <div key={idx} className="flex items-center gap-3 bg-paper rounded-[10px] px-4 py-3">
                      <span className="flex-1 text-sm text-charcoal font-medium">{item.name} <span className="text-subtle-ash font-normal">x{item.quantity}</span></span>
                      <div className="flex items-center gap-1">
                        <span className="text-subtle-ash text-sm">$</span>
                        <input
                          type="number" min="0"
                          className="w-20 text-right border border-soft-gray rounded-[15px] px-2 py-1 text-sm focus:outline-none focus:border-blue-400"
                          value={item.price}
                          onChange={e => {
                            const newPrice = Number(e.target.value) || 0;
                            setEditPriceOrder(prev => {
                              const items = prev.items.map((it, i) => i === idx ? { ...it, price: newPrice, total: newPrice * it.quantity } : it);
                              return { ...prev, items };
                            });
                          }}
                        />
                      </div>
                      <span className="text-sm text-subtle-ash w-16 text-right">${item.total}</span>
                    </div>
                  ))}
                </div>
                <div className="flex justify-between items-center border-t border-soft-gray pt-4 mb-5">
                  <span className="text-sm font-semibold text-charcoal">總金額</span>
                  <span className="text-xl font-bold text-green-600">${editPriceOrder.items.reduce((s, i) => s + i.total, 0)}</span>
                </div>
                <div className="flex gap-3">
                  <button type="button" onClick={() => setEditPriceOrder(null)} className="flex-1 py-2.5 bg-slate-100 text-subtle-ash text-sm font-medium rounded-[10px] hover:bg-slate-200 transition-colors">取消</button>
                  <button type="button" onClick={() => handleSaveEditedPrices(editPriceOrder.id, editPriceOrder.items)} className="flex-1 py-2.5 bg-blue-500 text-white text-sm font-medium rounded-[10px] shadow-sm hover:bg-blue-600 transition-colors">確認儲存</button>
                </div>
              </div>
            </div>
          )}

          {showPwdModal && (
            <div className="fixed inset-0 bg-black/40 z-[100] flex items-center justify-center p-4 animate-in fade-in">
              <form onSubmit={handleAdminAuth} className="bg-white rounded-[10px] p-6 max-w-sm w-full shadow-2xl text-center border border-soft-gray">
                <h3 className="text-lg font-bold mb-4 text-charcoal">管理員驗證</h3>
                <input type="password" autoFocus placeholder="請輸入密碼" className="w-full p-3 bg-white rounded-[10px] text-center text-xl font-medium tracking-[0.5em] border border-soft-gray focus:border-[#f97316] outline-none shadow-sm mb-2 transition-colors" value={pwdInput} onChange={e => setPwdInput(e.target.value)} />
                {pwdError && <p className="text-red-500 text-xs mb-3">密碼錯誤，請重試</p>}
                <div className="flex gap-2 mt-4"><button type="button" onClick={() => setShowPwdModal(false)} className="flex-1 py-2.5 bg-slate-100 text-subtle-ash text-sm font-medium rounded-[15px] hover:bg-slate-200 transition-colors">取消</button><button type="submit" className="flex-1 py-2.5 bg-[#f97316] text-white text-sm font-medium rounded-[15px] shadow-sm hover:bg-orange-600 transition-colors">驗證</button></div>
              </form>
            </div>
          )}

          <div className="fixed bottom-4 left-4 flex items-center gap-2 text-xs font-medium z-[150] bg-white/90 px-3 py-1.5 rounded-[15px] shadow-sm border border-soft-gray">
            {dbStatus === 'online' ? <Wifi className="text-green-500" size={14} /> : <WifiOff className="text-red-500 animate-pulse" size={14} />}
            <span className={dbStatus === 'online' ? 'text-subtle-ash' : 'text-red-600'}>{dbStatus === 'online' ? '連線正常' : '連線中斷'}</span>
          </div>
        </div>
      );
    }
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
